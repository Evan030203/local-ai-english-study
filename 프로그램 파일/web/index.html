<!doctype html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로컬 AI 영어학습도구</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 24'%3E%3Crect width='32' height='24' rx='5' fill='%2319213A'/%3E%3Crect x='7' y='16' width='18' height='3' rx='1.5' fill='%23F5D547'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <nav id="rail" aria-label="메뉴">
    <div class="brand"><div class="brand-mark" aria-hidden="true"></div><div><b>영어학습도구</b><span>로컬 AI</span></div></div>
    <div class="rail-movie" id="railMovie" role="button" tabindex="0"></div>
    <button class="nav" data-view="home">영화</button>
    <button class="nav" data-view="study">장면 학습</button>
    <button class="nav" data-view="expr">표현 노트</button>
    <button class="nav" data-view="talk">면접·미팅 연습</button>
    <button class="nav" data-view="review">복습 <span class="count" id="reviewCount" hidden></span></button>
    <div class="rail-gap"></div>
    <div class="rail-jobs" id="railJobs"></div>
    <div class="rail-status" id="railStatus" aria-label="지금 쓰는 AI와 마이크"></div>
    <button class="nav" data-view="settings">설정</button>
  </nav>
  <main id="main">
    <section class="view" id="view-home"></section>
    <section class="view study-view" id="view-study" hidden></section>
    <section class="view" id="view-expr" hidden></section>
    <section class="view" id="view-talk" hidden></section>
    <section class="view" id="view-review" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>
</div>
<div id="toast" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
